name: Customer Segmentation CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run API tests
        run: python -m pytest

      - name: Retrain the segmentation model
        run: python src/train.py

      - name: Check that artifacts were produced
        run: |
          test -f models/kmeans_model.pkl
          test -f models/scaler.pkl
          test -f models/model_metadata.json
